name: Build experimental Huawei PanVK Android ZIP
on:
  push:
    paths:
      - 'src/panfrost/lib/kmod/kbase_kmod.c'
      - '.github/workflows/huawei-android.yml'
  workflow_dispatch:

concurrency:
  group: huawei-atom72-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux host dependencies (fast-fail on network outage)
        timeout-minutes: 3
        run: |
          # Prefer upstream Ubuntu mirrors over the runner's Azure mirror.
          # Azure DNS returned intermittent NXDOMAIN / timeout and caused
          # 16-minute apt retries before any driver compilation could start.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g; s|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          timeout 8s getent hosts archive.ubuntu.com >/dev/null || { echo 'ERROR: Ubuntu mirror DNS unavailable on this GitHub runner; aborting immediately.' >&2; exit 2; }
          timeout 45s sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=8 -o APT::Update::Error-Mode=any
          timeout 100s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=0 -o Acquire::http::Timeout=8 \
            build-essential git cmake pkg-config ninja-build glslang-tools \
            llvm-18-dev clang-18 libclang-18-dev libclc-18-dev \
            libllvmspirvlib-18-dev spirv-tools python3-venv python3-pip \
            python3-mako python3-packaging python3-yaml
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install 'meson>=1.4.0,<2' mako packaging pyyaml
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      # GitHub-hosted Ubuntu runners already include Android SDK cmdline tools.
      # Avoid setup-android@v3: its legacy "sdkmanager tools" call fails on
      # newer SDK repositories because the obsolete "tools" package was removed.
      - name: Install NDK r29
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'ndk;29.0.14206865'
      - name: Build Android arm64 Vulkan driver and ZIP
        env:
          CC: clang-18
          CXX: clang++-18
          LLVM_CONFIG: llvm-config-18
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh "$ANDROID_HOME/ndk/29.0.14206865"
          ls -lah dist
      - name: Upload experimental custom driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JimVulkan-PanVK-Huawei-Kirin990-EXPERIMENTAL
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JimVulkan-Huawei-build-logs
          path: |
            build-host/meson-logs/
            build-android/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
