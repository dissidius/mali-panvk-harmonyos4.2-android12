name: Build experimental Huawei PanVK Android ZIP
on:
  push:
    paths:
      - 'src/panfrost/lib/kmod/kbase_kmod.c'
      - '.github/workflows/huawei-android.yml'
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: huawei-atom72-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe published reusable H42 builder image
        id: builder
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/dissidius/panvk-h42-builder:llvm18-v1
      - name: Restore Ubuntu and Python dependency cache
        if: steps.builder.outcome != 'success'
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/h42-apt.txt', 'ci/h42-python.txt') }}
      - name: Restore incremental compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h42-ccache-v1-${{ runner.os }}-
      - name: Reuse cached tools, install only missing dependencies
        if: steps.builder.outcome != 'success'
        timeout-minutes: 7
        run: bash ci/h42-setup.sh
      - name: Save prepared dependency cache
        if: success() && steps.builder.outcome != 'success' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/h42-apt.txt', 'ci/h42-python.txt') }}
      - name: Build with reusable prebuilt toolchain (NDK from runner)
        if: steps.builder.outcome == 'success'
        timeout-minutes: 20
        run: |
          bash ci/h42-in-container.sh bash -c './build.sh "$ANDROID_HOME/ndk/29.0.14206865" && ls -lah dist'
      - name: Build Android arm64 Vulkan driver and ZIP
        if: steps.builder.outcome != 'success'
        env:
          CC: clang-18
          CXX: clang++-18
          LLVM_CONFIG: llvm-config-18
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh "$ANDROID_HOME/ndk/29.0.14206865"
          ls -lah dist
      - name: Report compiler cache hits
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || true
      - name: Save updated compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload experimental custom driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JimVulkan-PanVK-Huawei-Kirin990-EXPERIMENTAL
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JimVulkan-Huawei-build-logs
          path: |
            build-host/meson-logs/
            build-android/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
